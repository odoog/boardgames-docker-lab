services:
  db:
    image: postgres:16-alpine
    container_name: bg_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boardgames}
      POSTGRES_USER: ${POSTGRES_USER:-club}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-club_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]

  web-service:
    build: ./web-service
    container_name: bg_web_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]

  backend:
    build: ./backend
    container_name: bg_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-boardgames}
      DB_USER: ${POSTGRES_USER:-club}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-club_pass}
      WEB_SERVICE_URL: http://web-service:5001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    networks: [app_net]

  frontend:
    build: ./frontend
    container_name: bg_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
